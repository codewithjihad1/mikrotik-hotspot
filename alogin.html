<!doctype html>
<html>
    <head>
        <title id="title"></title>
        <meta http-equiv="refresh" content="2; url=$(link-redirect)" />
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="theme-color" content="#3B5998" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="shortcut icon" href="./img/logo.png" type="image/x-icon" />
        <link rel="stylesheet" href="./css/style.css" />
        <script type="text/javascript">
            // The hotspot "if / endif" directives below are resolved by RouterOS
            // before the page is sent. They sit inside // comments so that code
            // editors can still parse this block as valid JavaScript.
            function startClock() {
                // $(if popup == 'true')
                open(
                    '$(link-status)',
                    'hotspot_status',
                    'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200',
                );
                // $(endif)
                location.href = './success.html';
            }
        </script>
    </head>
    <body onLoad="startClock()">
        <table width="100%" height="100%">
            <tr>
                <td align="center" valign="middle">
                    You are connected
                    <br /><br />
                    If not, <a style="color: blue" href="$(link-login)">Click here</a>
                </td>
            </tr>
        </table>
        <script type="text/javascript">
            document.getElementById('title').innerHTML = window.location.hostname + ' > redirect';
        </script>
    </body>
</html>
